<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIXGT — Who We Are</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Manrope", sans-serif;
      background: #f4f5f2;
      color: #182231;
    }

    .who-visual {
      position: relative;
      padding: clamp(70px, 8vw, 115px) clamp(24px, 6vw, 90px);
      background: #f4f5f2;
      overflow: hidden;
    }

    .who-visual-head {
      display: grid;
      grid-template-columns: .8fr 1.2fr;
      gap: 40px;
      align-items: end;
      margin-bottom: 48px;
    }

    .who-visual-label {
      margin: 0;
      font: 10px "DM Mono", monospace;
      letter-spacing: .13em;
      color: #66717d;
      text-transform: uppercase;
    }

    .who-visual-title {
      margin: 0;
      color: #182231;
      font-size: clamp(44px, 6.2vw, 86px);
      line-height: .9;
      letter-spacing: -.065em;
      max-width: 900px;
    }

    .who-visual-title em {
      font-style: normal;
      color: #4e667b;
    }

    .who-visual-sub {
      margin: 18px 0 0;
      max-width: 500px;
      color: #65717d;
      font-size: 14px;
      line-height: 1.6;
    }

    .who-screen-grid {
      display: grid;
      grid-template-columns: 1.35fr .65fr;
      grid-template-rows: 260px 260px;
      gap: 12px;
    }

    .who-screen-card {
      position: relative;
      overflow: hidden;
      background: #152334;
      min-height: 0;
    }

    .who-screen-card.main {
      grid-row: 1 / 3;
    }

    .who-screen-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .7s ease;
    }

    .who-screen-card:hover img {
      transform: scale(1.035);
    }

    .who-screen-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        transparent 45%,
        rgba(8, 16, 25, .72)
      );
      pointer-events: none;
    }

    .who-screen-meta {
      position: absolute;
      left: 22px;
      right: 22px;
      bottom: 20px;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      color: #fff;
    }

    .who-screen-meta span {
      font: 9px "DM Mono", monospace;
      letter-spacing: .11em;
      color: #caff48;
      text-transform: uppercase;
    }

    .who-screen-meta strong {
      display: block;
      margin-top: 6px;
      font-size: 18px;
      letter-spacing: -.025em;
    }

    .who-screen-meta b {
      font-size: 20px;
      font-weight: 400;
    }

    .who-visual-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(24, 34, 49, .14);
    }

    .who-visual-bottom span {
      font: 9px "DM Mono", monospace;
      color: #737e89;
      letter-spacing: .1em;
    }

    .who-visual-bottom strong {
      color: #182231;
      font-size: 13px;
      font-weight: 600;
    }

    @media (max-width: 760px) {
      .who-visual-head {
        grid-template-columns: 1fr;
        gap: 22px;
      }

      .who-screen-grid {
        grid-template-columns: 1fr;
        grid-template-rows: 360px 210px 210px;
      }

      .who-screen-card.main {
        grid-row: auto;
      }

      .who-visual-bottom {
        display: block;
      }

      .who-visual-bottom strong {
        display: block;
        margin-top: 8px;
      }
    }
  </style>
</head>

<body>

  <!-- WHO WE ARE ONLY -->
  <section class="who-visual">

    <div class="who-visual-head">
      <p class="who-visual-label">/ Who we are</p>

      <div>
        <h1 class="who-visual-title">
          We make <em>screens</em> work harder.
        </h1>

        <p class="who-visual-sub">
          Digital displays built to inform, engage, and bring spaces to life.
        </p>
      </div>
    </div>

    <div class="who-screen-grid">

      <article class="who-screen-card main">
        <img
          src="https://www.the-entourage.com/hubfs/AI-Generated%20Media/Images/An%20image%20of%20a%20retail%20store%20with%20a%20large%20LED%20video%20wall%20displaying%20dynamic%20content%20to%20engage%20customers%20and%20enhance%20the%20shopping%20experience.jpeg"
          alt="Large LED video wall in a retail environment"
        >

        <div class="who-screen-meta">
          <div>
            <span>01 / Core concept</span>
            <strong>LED Video Walls</strong>
          </div>
          <b>↗</b>
        </div>
      </article>

      <article class="who-screen-card">
        <img
          src="https://omangraphicsco.com/img/services/digital-display-solution.jpg"
          alt="Digital displays in a retail space"
        >

        <div class="who-screen-meta">
          <div>
            <span>02 / Experience</span>
            <strong>Digital Signage</strong>
          </div>
          <b>↗</b>
        </div>
      </article>

      <article class="who-screen-card">
        <img
          src="https://media.zenobuilder.com/upload/iqp5to1dbf/Video-wall-retail-73018478.jpg"
          alt="Commercial video wall installation"
        >

        <div class="who-screen-meta">
          <div>
            <span>03 / Solutions</span>
            <strong>Commercial Displays</strong>
          </div>
          <b>↗</b>
        </div>
      </article>

    </div>

    <div class="who-visual-bottom">
      <span>MIX GENERATION TECHNOLOGY · JORDAN</span>
      <strong>Display · Experience · Technology</strong>
    </div>

  </section>

</body>
</html>
